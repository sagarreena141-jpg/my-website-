<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        .hero {
            padding: 80px 20px;
        }

        h1 {
            font-size: 50px;
            animation: zoom 1.5s ease;
        }

        .videos {
            background: white;
            color: #222;
            padding: 60px 20px;
        }

        .videos h2 {
            font-size: 38px;
        }

        .video-box {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 20px;
        }

        video {
            width: 100%;
            border-radius: 15px;
        }

        footer {
            padding: 25px;
            background: #111827;
        }

        @keyframes zoom {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">My Website 🚀</div>

        <nav>
            <a href="#">Home</a>
            <a href="#videos">Videos</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome 👋</h1>
        <p>Welcome to my website!</p>
    </section>

    <section class="videos" id="videos">
        <h2>My Videos 🎬</h2>

        <div class="video-box">
            <h3>My First Video</h3>

            <video controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support video.
            </video>
        </div>

    </section>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
