<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 25px;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            animation: glow 2s infinite alternate;
        }

        .hero {
            padding: 120px 20px;
        }

        h1 {
            font-size: 55px;
            animation: zoomIn 1.5s ease;
        }

        p {
            font-size: 20px;
            animation: slideUp 2s ease;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            animation: bounce 2s infinite;
        }

        button:hover {
            transform: scale(1.15);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.3);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes glow {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">My Website 🚀</div>
    </header>

    <section class="hero">
        <h1>Welcome 👋</h1>

        <p>Welcome to my animated website!</p>

        <button onclick="welcome()">Click Me</button>
    </section>

    <script>
        function welcome() {
            alert("Welcome to my website! 🎉");
        }
    </script>

</body>
</html>
